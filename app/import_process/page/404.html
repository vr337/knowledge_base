<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --text: #2c3e50;
            --text-secondary: #7f8c9b;
            --primary: #4a7cf7;
            --primary-hover: #3a6ce7;
            --card-bg: #ffffff;
            --glow: rgba(74, 124, 247, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14161a;
                --text: #e8eaed;
                --text-secondary: #9aa0a6;
                --primary: #6b93f8;
                --primary-hover: #82a5f9;
                --card-bg: #1e2126;
                --glow: rgba(107, 147, 248, 0.12);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .code {
            font-size: clamp(96px, 22vw, 160px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--primary), var(--text));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .divider {
            width: 56px;
            height: 4px;
            border-radius: 2px;
            background: var(--primary);
            margin: 24px auto;
            box-shadow: 0 0 24px 4px var(--glow);
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--glow);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--text-secondary);
        }

        .btn-ghost:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .hint {
            margin-top: 40px;
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="code">404</div>
        <div class="divider"></div>
        <h1>页面走丢了</h1>
        <p>抱歉，您访问的页面不存在或已被移动。</p>
        <div class="actions">
            <a class="btn btn-primary" href="/">返回首页</a>
            <button class="btn btn-ghost" onclick="history.back()">返回上一页</button>
        </div>
        <p class="hint">错误代码：404 Not Found</p>
    </main>
</body>
</html>
